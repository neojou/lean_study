name = "my_first_lean_project"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["MyFirstLeanProject"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.0-rc2"

[[lean_lib]]
name = "MyFirstLeanProject"

[[lean_exe]]
name = "my_first_lean_project"
root = "MyFirstLeanProject" 